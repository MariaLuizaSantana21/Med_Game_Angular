<div class = "titulo-pergunta">
    <h1>Resultado:</h1>
</div>
<div class ="pontos">
    @if(quiz.pontuacao() == quiz.totalPerguntas()){
         <p> Parabéns!</p>
         <p>Você acertou um total de {{quiz.pontuacao()}} de {{quiz.totalPerguntas()}} pontos!</p>
    }
    @else {
        <p> Quase lá!</p>
         <p>Você acertou um total de {{quiz.pontuacao()}} de {{quiz.totalPerguntas()}} pontos</p>
    }
</div>
<div class = "jogar-novamente">
    <button class="botao" type ="button" (click)= "jogarNovamente()">
        Jogar Novamente
    </button>
</div>
