<div class ="perguntas">
    <h1>Perguntas</h1>
    <p class = "nome-pergunta">{{quiz.perguntaAtual()?.pergunta}}</p>
    <p>{{quiz.perguntaAtual().alternativas}}</p>
    <button type ="button" (click)= "escolherResposta(0)">
        Letra A
    </button>
    <button type ="button" (click)= "escolherResposta(1)">
        Letra B
    </button>
    <button type ="button" (click)= "escolherResposta(2)">
        Letra C
    </button>
    <button type ="button" (click)= "escolherResposta(3)">
        Letra D
    </button>
    <p> pontos: {{quiz.pontuacao()}}</p>
</div>
